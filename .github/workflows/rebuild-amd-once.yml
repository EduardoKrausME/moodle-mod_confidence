name: One-time Moodle AMD rebuild

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/rebuild-amd-once.yml

permissions:
  contents: write

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout Moodle 4.5
        uses: actions/checkout@v4
        with:
          repository: moodle/moodle
          ref: MOODLE_405_STABLE
          path: .moodle-build

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Moodle JavaScript tooling
        working-directory: .moodle-build
        run: npm ci

      - name: Build plugin AMD modules with Moodle Grunt
        run: |
          mkdir -p .moodle-build/mod/confidence
          rsync -a --delete \
            --exclude='.git' \
            --exclude='.moodle-build' \
            ./ .moodle-build/mod/confidence/
          cd .moodle-build
          npx grunt amd --root=mod/confidence
          cd ..
          rm -rf amd/build
          cp -R .moodle-build/mod/confidence/amd/build amd/build

      - name: Commit generated AMD build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add amd/build
          if git diff --cached --quiet; then
            echo "AMD build already matches Moodle Grunt output."
          else
            git commit -m "Build AMD modules with Moodle Grunt"
            git push origin HEAD:master
          fi
